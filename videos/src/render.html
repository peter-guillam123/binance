<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<title>Binance heist video renderer</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=JetBrains+Mono:wght@400;500;600;700&family=Newsreader:ital,opsz,wght@0,6..72,400..700;1,6..72,400..600&display=swap">
<style>
/* 1080x1920 frame. Safe area for text: x 90-930 (right rail left clear), y 140-1500. */
:root{
  --bg:#ECEFF3; --fg:#0F141C; --fg-2:#3A4454; --muted:#5B6576; --rule:#C7CED8; --raise:#F7F8FA; --held:#CDD3DC;
  --hot:#DD4519; --hot-ink:#B23812; --hot-wash:#F9DDD3; --cold:#1C6FC0; --cold-wash:#D5E7F8; --dollar:#13966A; --mark:#98A1AF;
  --f-display:"Archivo",Arial,sans-serif; --f-body:"Newsreader",Georgia,serif; --f-mono:"JetBrains Mono",Menlo,monospace;
}
.night{--bg:#0B1120; --fg:#E8ECF4; --fg-2:#C5CDDB; --muted:#9AA6BB; --rule:#29334B; --raise:#151D31; --held:#2A3450; --hot:#FF6A3D; --hot-ink:#FF8A62; --mark:#56627B}
html,body{margin:0;background:#000}
#stage{position:relative;width:1080px;height:1920px;overflow:hidden;background:var(--bg);color:var(--fg);font-family:var(--f-body)}
#stage *{box-sizing:border-box}
.prog{position:absolute;left:0;top:0;height:10px;width:1080px;background:var(--hot);transform-origin:0 50%}
.series{position:absolute;left:90px;top:140px;display:flex;gap:20px;align-items:baseline;white-space:nowrap}
.series b{font-family:var(--f-display);font-stretch:125%;font-weight:800;font-size:34px;letter-spacing:-.01em}
.series b i{color:var(--hot);font-style:normal}
.series span{font-family:var(--f-mono);font-size:25px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.blk{position:absolute;left:90px;width:840px}
.h{font-family:var(--f-display);font-stretch:125%;font-weight:850;line-height:.98;letter-spacing:-.022em;margin:0}
.w{display:inline-block}
.hot{color:var(--hot)} .cold{color:var(--cold)}
.sup{font-family:var(--f-body);font-size:48px;line-height:1.25;font-weight:500;color:var(--fg-2);margin:0}
.lab{font-family:var(--f-mono);font-size:28px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:500}
.src{position:absolute;left:90px;top:1520px;width:840px;font-family:var(--f-mono);font-size:25px;color:var(--muted);line-height:1.4}
.fade{opacity:0}
/* end card */
.end{position:absolute;inset:0;background:var(--bg);opacity:0}
.end-in{position:absolute;left:90px;top:470px;width:840px;display:flex;flex-direction:column;align-items:flex-start;gap:34px}
.end .k{font-family:var(--f-mono);font-size:30px;letter-spacing:.1em;color:var(--hot-ink);font-weight:600}
.end .t{font-size:118px;margin-top:-14px}
.end .d{width:800px}
.end .url{font-family:var(--f-mono);font-size:38px;font-weight:600;padding:22px 30px;border:3px solid var(--fg);border-radius:999px;white-space:nowrap;margin-top:10px}
.end .f{width:800px;font-family:var(--f-mono);font-size:25px;line-height:1.5;color:var(--muted)}
/* v1 */
.clock{font-family:var(--f-mono);font-weight:600;font-size:110px;letter-spacing:-.03em;line-height:1}
.clock small{font-size:40px;color:var(--muted);font-weight:500;margin-left:14px;letter-spacing:.04em}
.zones{font-family:var(--f-mono);font-size:28px;color:var(--muted)}
.counter{font-family:var(--f-display);font-stretch:125%;font-weight:850;font-size:150px;line-height:.95;letter-spacing:-.02em;color:var(--hot)}
canvas{position:absolute;left:0;top:0}
.legend{display:flex;flex-wrap:wrap;gap:10px 28px;font-family:var(--f-mono);font-size:26px;color:var(--fg-2)}
.legend span{display:inline-flex;align-items:center;gap:10px}
.legend i{width:22px;height:22px;border-radius:5px;display:inline-block}
.legend b{color:var(--fg);font-weight:600}
.tag{position:absolute;font-family:var(--f-mono);font-size:30px;font-weight:600;color:#fff;background:#0F141C;padding:10px 16px;border-radius:10px;white-space:nowrap;box-shadow:0 0 0 4px #ECEFF3}
/* v2 nodes */
.node{position:absolute;left:90px;width:780px;height:124px;border:3px solid var(--rule);border-radius:24px;background:var(--raise);display:flex;align-items:center;gap:26px;padding:0 30px}
.node svg{width:64px;height:64px;flex:none;stroke:var(--fg-2);fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.node b{display:block;font-family:var(--f-display);font-stretch:112%;font-weight:750;font-size:44px;line-height:1.05}
.node small{display:block;font-family:var(--f-mono);font-size:26px;color:var(--muted);margin-top:6px}
.node .glow{position:absolute;inset:-12px;border-radius:32px;border:8px solid var(--hot);opacity:0}
.node.tall{height:196px;flex-direction:column;align-items:flex-start;justify-content:center;gap:16px}
.node.tall .row{display:flex;align-items:center;gap:26px}
.tiles{display:flex;gap:8px}
.tiles span{width:64px;height:48px;border-radius:8px;border:2px solid var(--rule);display:grid;place-items:center;font-family:var(--f-mono);font-size:16px;font-weight:700;color:var(--muted);background:var(--bg)}
.wire{position:absolute;width:8px;margin-left:-4px;background:var(--hot);transform-origin:50% 0;border-radius:4px}
.dot{position:absolute;width:22px;height:22px;margin:-11px 0 0 -11px;border-radius:50%;background:var(--hot);box-shadow:0 0 0 5px var(--bg)}
/* v3 */
.lane-lab{position:absolute;left:90px;font-family:var(--f-mono);font-size:30px;letter-spacing:.06em;text-transform:uppercase;color:var(--fg-2);font-weight:500}
.road{position:absolute;left:90px;width:840px;height:6px;background:var(--rule);border-radius:3px}
.gate{position:absolute;width:20px;height:170px;margin-left:-10px;border-radius:8px;background:var(--cold);box-shadow:0 0 0 18px rgba(28,111,192,.16)}
.gate-lab{position:absolute;font-family:var(--f-mono);font-size:26px;color:var(--muted);white-space:nowrap;transform:translateX(-50%)}
.coin{position:absolute;width:100px;height:100px;margin:-50px 0 0 -50px;border-radius:50%;display:grid;place-items:center;color:#fff;font-family:var(--f-mono);font-weight:700;font-size:50px;box-shadow:0 0 0 7px var(--bg)}
.coin>*{grid-area:1/1}
.coin svg{width:56px;height:56px;stroke:#fff;fill:none;stroke-width:1.9;stroke-linecap:round}
.bar-row{position:absolute;left:90px;width:840px}
.bar-row .n{font-family:var(--f-mono);font-size:30px;color:var(--fg-2);margin-bottom:12px}
.bar-row .n b{color:var(--fg);font-weight:700}
.bar{height:72px;border-radius:0 10px 10px 0;transform-origin:0 50%}
.stackbar{position:absolute;left:90px;width:840px;height:110px;display:flex;gap:6px}
.stackbar div{height:100%;transform-origin:0 50%}
/* v4 */
.sq-row{position:absolute;left:90px;width:840px}
.sq-row .n{display:flex;justify-content:space-between;align-items:baseline;gap:20px;margin-bottom:12px}
.sq-row .n b{font-family:var(--f-display);font-stretch:112%;font-weight:750;font-size:40px}
.sq-row .n span{font-family:var(--f-mono);font-size:28px;color:var(--muted);white-space:nowrap}
.sq-row .n em{font-style:normal;font-family:var(--f-mono);font-weight:700;font-size:32px;color:var(--fg)}
.big{font-family:var(--f-display);font-stretch:125%;font-weight:900;font-size:340px;line-height:.85;letter-spacing:-.04em;color:var(--hot)}
</style>
</head>
<body>
<div id="stage"></div>
<script>
"use strict";
const stage = document.getElementById("stage");
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const seg = (t, a, b) => clamp((t - a) / (b - a));
const ease = (x) => 1 - Math.pow(1 - x, 3);
const easeIO = (x) => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
const lerp = (a, b, p) => a + (b - a) * p;
function rng(seed) { return () => (seed = (seed * 16807) % 2147483647) / 2147483647; }
function el(tag, cls, html, parent = stage, style) {
  const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html;
  if (style) Object.assign(e.style, style); parent.appendChild(e); return e;
}
const esc = (s) => s.replace(/&/g, "&amp;").replace(/</g, "&lt;");
/* kinetic text: *hot* and ~cold~ markers */
function kin(e, text) {
  e.innerHTML = ""; const ws = []; let mode = null;
  text.split(/\s+/).forEach((tok) => {
    let html = "", buf = "";
    const flush = () => { if (buf) { html += mode ? `<span class="${mode}">${esc(buf)}</span>` : esc(buf); buf = ""; } };
    for (const ch of tok) {
      if (ch === "*" || ch === "~") { flush(); const m = ch === "*" ? "hot" : "cold"; mode = mode === m ? null : m; }
      else buf += ch;
    }
    flush();
    const w = document.createElement("span"); w.className = "w"; w.innerHTML = html;
    e.appendChild(w); e.appendChild(document.createTextNode(" ")); ws.push(w);
  });
  e._w = ws; return e;
}
function showKin(e, t, tin, tout, o = {}) {
  const st = o.stagger ?? .065, du = o.dur ?? .55, dy = o.dy ?? 50;
  const vis = t >= tin && (tout == null || t < tout);
  e.style.visibility = vis ? "visible" : "hidden";
  if (!vis) return;
  const out = tout == null ? 0 : ease(seg(t, tout - .4, tout));
  e._w.forEach((w, i) => {
    const p = ease(seg(t, tin + i * st, tin + i * st + du));
    w.style.opacity = p * (1 - out);
    w.style.transform = `translateY(${(1 - p) * dy - out * 26}px)`;
  });
}
function fade(e, t, tin, tout, o = {}) {
  const du = o.dur ?? .5, dy = o.dy ?? 36;
  const pin = ease(seg(t, tin, tin + du)), pout = tout == null ? 0 : ease(seg(t, tout - .4, tout));
  const op = Math.min(pin, 1 - pout);
  e.style.opacity = op; e.style.visibility = op > .001 ? "visible" : "hidden";
  e.style.transform = `translateY(${(1 - pin) * dy - pout * 20}px)` + (o.extra || "");
  return op;
}
function hex(c) { const n = parseInt(c.slice(1), 16); return [n >> 16, (n >> 8) & 255, n & 255]; }
function mix(a, b, p) { return [0, 1, 2].map(i => Math.round(lerp(a[i], b[i], p))); }
const css = (a) => `rgb(${a[0]},${a[1]},${a[2]})`;

/* shared furniture: progress line, series label, source line, end card */
function frame(o) {
  if (o.night) stage.classList.add("night");
  const f = {};
  f.prog = el("div", "prog");
  f.series = el("div", "series", `<b>The Binance heist<i>.</i></b><span>${o.part} of 4 · ${o.name}</span>`);
  f.src = el("div", "src fade", o.src);
  f.end = el("div", "end");
  const ei = el("div", "end-in", null, f.end);
  el("div", "k", "READ THE FULL EXPLAINER", ei);
  el("h2", "h t", "The Binance heist", ei);
  el("p", "sup d", "What happened, who is blamed and what it means for crypto, in plain English.", ei);
  el("div", "url", "peter-guillam123.github.io/binance", ei);
  el("p", "f", `Part ${o.part} of 4 · Based on Guardian reporting and data from TRM Labs and Chainalysis`, ei);
  f.endKids = [...ei.children];
  f.endIn = o.endIn; f.dur = o.dur; f.srcIn = o.srcIn ?? 3.6;
  f.seek = (t) => {
    f.prog.style.transform = `scaleX(${clamp(t / o.dur)})`;
    fade(f.src, t, f.srcIn, f.endIn, { dy: 0 });
    const pe = ease(seg(t, o.endIn, o.endIn + .6));
    f.end.style.opacity = pe;
    f.endKids.forEach((c, i) => { const p = ease(seg(t, o.endIn + .25 + i * .12, o.endIn + .85 + i * .12)); c.style.opacity = p; c.style.transform = `translateY(${(1 - p) * 40}px)`; });
  };
  return f;
}

function beat(text, sup, a, b, size = 72) {
  const w = el("div", "blk", null, stage, { top: "270px" });
  const h = kin(el("h2", "h", null, w, { fontSize: size + "px" }), text);
  let sp = null;
  if (sup) sp = sup.startsWith("LAB:") ? el("p", "lab fade", sup.slice(4), w, { marginTop: "26px" }) : el("p", "sup fade", sup, w, { marginTop: "26px", fontSize: "44px" });
  return [h, sp, a, b];
}
const VIDEOS = {};

/* ===================== 1. Twenty minutes ===================== */
VIDEOS[1] = { dur: 44, build() {
  const F = frame({ part: 1, name: "Twenty minutes", dur: 44, endIn: 38.2, src: "Data: TRM Labs, 30 October 2026. Frozen total: Binance." });
  const hook = kin(el("h1", "h blk", null, stage, { top: "520px", fontSize: "124px" }), "How long does it take to steal *$6.3bn?*");
  const clockG = el("div", "blk", `<div class="lab">Thursday 29 October</div><div class="clock" id="clk">20:05:00<small>UTC</small></div><div class="zones" id="zn">London 20:05 · Pyongyang 05:05 Friday</div>`, stage, { top: "268px" });
  const cntG = el("div", "blk", `<div class="lab">Taken from Binance</div><div class="counter" id="cnt">$0.00bn</div>`, stage, { top: "520px" });
  const h2 = kin(el("h2", "h blk", null, stage, { top: "290px", fontSize: "88px" }), "*Twenty minutes.* The biggest crypto theft on record.");
  const h3 = kin(el("h2", "h blk", null, stage, { top: "290px", fontSize: "88px" }), "*Four times* the size of the previous record.");
  const h4 = kin(el("h2", "h blk", null, stage, { top: "290px", fontSize: "88px" }), "About ~$3bn~ has been frozen. The rest is on the move.");
  const clk = clockG.querySelector("#clk"), zn = clockG.querySelector("#zn"), cnt = cntG.querySelector("#cnt");
  // waffle
  const COLS = 28, CELL = 30, GAP = 3, X0 = 90, Y0 = 730;
  const cv = el("canvas", null, null, stage); cv.width = 1080; cv.height = 1920; const g = cv.getContext("2d");
  const CH = [["eth", 379, 279, "#2a78d6"], ["btc", 147, 0, "#eda100"], ["trx", 63, 61, "#e87ba4"], ["xrp", 30, 0, "#6250d6"], ["sol", 10, 0, "#1baf7a"], ["oth", 8, 0, "#8a93a3"]];
  const SQ = []; CH.forEach(([k, n, st, c]) => { for (let j = 0; j < n; j++) SQ.push({ k, st: j < st, c: hex(c) }); });
  let fz = 0; SQ.forEach(s => { s.fz = s.st && fz < 300 && ++fz > 0; });
  const N = SQ.length;
  const frozenOrder = [...SQ.keys()].sort((a, b) => (SQ[b].fz - SQ[a].fz) || (a - b));
  frozenOrder.forEach((i, k) => SQ[i].posC = k);
  const r = rng(29); const xrp = [], rest = [];
  SQ.forEach((s, i) => (s.k === "xrp" ? xrp : rest).push(i));
  for (let i = rest.length - 1; i > 0; i--) { const j = Math.floor(r() * (i + 1)); [rest[i], rest[j]] = [rest[j], rest[i]]; }
  const seq = xrp.concat(rest); seq.forEach((i, k) => SQ[i].rank = k);
  const HELD = hex("#CDD3DC"), HOT = hex("#DD4519"), INK = hex("#0F141C"), COLD = hex("#1C6FC0");
  const FILL0 = 5.0, FILL1 = 19.0;
  const fillE = (t) => { const p = seg(t, FILL0, FILL1); return 1 - Math.pow(1 - p, 1.7); };
  const xy = (k) => [X0 + (k % COLS) * CELL, Y0 + Math.floor(k / COLS) * CELL];
  // legends and tags
  const leg0 = el("div", "blk legend", `<span>Each square is $10m</span>`, stage, { top: "1440px" });
  const leg1 = el("div", "blk legend", CH.map(([k, n, s, c], i) => `<span><i style="background:${c}"></i>${["Ethereum", "Bitcoin", "Tron", "XRP", "Solana", "Others"][i]} <b>${["$3.79bn", "$1.47bn", "$628m", "$296m", "$96m", "$77m"][i]}</b></span>`).join(""), stage, { top: "1418px", fontSize: "24px", gap: "8px 22px" });
  const leg2 = el("div", "blk legend", `<span><i style="background:#0F141C"></i>Bybit, 2025 <b>$1.5bn</b></span><span><i style="background:#DD4519"></i>Binance, 2026 <b>$6.36bn</b></span>`, stage, { top: "1440px" });
  const leg3 = el("div", "blk legend", `<span><i style="background:#1C6FC0"></i>Frozen <b>about $3bn</b></span><span><i style="background:#DD4519"></i>Not frozen <b>about $3.4bn</b></span>`, stage, { top: "1440px" });
  const tagB = el("div", "tag", "Previous record: Bybit, $1.5bn", stage, { left: "120px", top: (Y0 + 50) + "px" });
  const pad = (n) => String(n).padStart(2, "0");
  return (t) => {
    F.seek(t);
    showKin(hook, t, .15, 3.5);
    fade(clockG, t, 3.6, 19.6); fade(cntG, t, 3.9, 19.6);
    const e = fillE(t), shown = Math.round(e * N);
    const secs = Math.round(e * 1200), m = 5 + Math.floor(secs / 60), s = secs % 60;
    clk.innerHTML = `20:${pad(m)}:${pad(s)}<small>UTC</small>`;
    zn.textContent = `London 20:${pad(m)} · Pyongyang 05:${pad(m)} Friday`;
    cnt.textContent = "$" + (shown >= N ? 6.36 : shown * .01).toFixed(2) + "bn";
    showKin(h2, t, 19.8, 25.2); showKin(h3, t, 25.4, 31.2); showKin(h4, t, 31.4, 38.2);
    fade(leg0, t, 4.4, 19.4, { dy: 0 }); fade(leg1, t, 19.6, 25.2, { dy: 0 }); fade(leg2, t, 25.6, 31.2, { dy: 0 }); fade(leg3, t, 32.4, 38.2, { dy: 0 });
    fade(tagB, t, 26.4, 31.0, { dy: 0 });
    // squares
    g.clearRect(0, 0, 1080, 1920);
    const appear = ease(seg(t, 3.9, 4.7)), gone = ease(seg(t, 37.7, 38.3));
    if (appear <= 0 || gone >= 1) return;
    const sz = CELL - GAP;
    for (let i = 0; i < N; i++) {
      const q = SQ[i];
      // colour by phase
      const revealAt = FILL0 + (FILL1 - FILL0) * (1 - Math.pow(1 - (q.rank + 1) / N, 1 / 1.7));
      const pf = seg(t, revealAt, revealAt + .3);
      let col = mix(HELD, q.c, pf);
      const row = Math.floor(i / COLS);
      const pb = ease(seg(t, 25.4 + row * .025, 25.9 + row * .025));
      if (pb > 0) col = mix(col, i < 146 ? INK : HOT, pb);
      const posK = (() => { const pm = easeIO(seg(t, 31.6 + (q.posC % COLS) * .012 + Math.floor(q.posC / COLS) * .01, 32.8 + (q.posC % COLS) * .012 + Math.floor(q.posC / COLS) * .01)); return pm; })();
      if (posK > 0) col = mix(col, q.fz ? COLD : HOT, ease(seg(t, 32.4 + (q.posC / N) * .9, 33.0 + (q.posC / N) * .9)));
      const [ax, ay] = xy(i), [cx, cy] = xy(q.posC);
      const x = lerp(ax, cx, posK), y = lerp(ay, cy, posK);
      const pop = pf > 0 && pf < 1 ? Math.sin(pf * Math.PI) * 5 : 0;
      g.globalAlpha = appear * (1 - gone);
      g.fillStyle = css(col);
      g.beginPath(); g.roundRect(x - pop / 2, y - pop / 2, sz + pop, sz + pop, 4); g.fill();
    }
    g.globalAlpha = 1;
  };
} };

/* ===================== 2. One laptop ===================== */
const ICON = {
  staff: '<rect x="6" y="7" width="20" height="13" rx="2"/><path d="M3 24h26l-2 3H5z"/>',
  sys: '<rect x="5" y="5" width="22" height="7" rx="2"/><rect x="5" y="15" width="22" height="7" rx="2"/><path d="M9 8.5h2M9 18.5h2M16 26v3M11 29h10"/>',
  hot: '<path d="M5 10h19a3 3 0 0 1 3 3v10a3 3 0 0 1-3 3H8a3 3 0 0 1-3-3z"/><path d="M5 10l15-5 2 5"/><circle cx="21" cy="18" r="1.6"/><path d="M24.5 3.5a5 5 0 0 1 3 3M23 1a8 8 0 0 1 6 5" stroke-width="1.4"/>',
  chain: '<rect x="3" y="11" width="8" height="10" rx="1.5"/><rect x="12" y="11" width="8" height="10" rx="1.5"/><rect x="21" y="11" width="8" height="10" rx="1.5"/>'
};
VIDEOS[2] = { dur: 46, build() {
  const F = frame({ part: 2, name: "One laptop", dur: 46, endIn: 38.4, src: "Sources: Binance; TRM Labs, 30 October 2026", srcIn: 3.8 });
  const beats = [
    [kin(el("h1", "h blk", null, stage, { top: "300px", fontSize: "124px" }), "It started with *one laptop.*"), null, .15, 3.5],
    beat("A hacked laptop belonging to a *Binance engineer.*", "Binance says this may have been the way in. It has not said how the laptop was hacked.", 3.7, 9.8, 72),
    beat("From it, the attacker reached the *withdrawal system.*", "The software that checks and sends customers’ withdrawals.", 10.0, 15.8, 72),
    beat("It sent *fake orders.* The system paid them.", "Binance says no secret keys leaked. Its own system did the work.", 16.0, 22.2, 72),
    beat("*$6.36bn* left on ten blockchains in about 20 minutes.", "From 8.05pm UK time on Thursday, according to TRM Labs.", 22.4, 30.2, 72),
    beat("Investigators blame *North Korea.*", "Its hackers often get in through staff: fake job offers, booby-trapped coding tests, fake employees.", 30.4, 38.4, 72)
  ];
  const mk = (top, icon, title, sub, tall) => {
    const n = el("div", "node fade" + (tall ? " tall" : ""), null, stage, { top: top + "px" });
